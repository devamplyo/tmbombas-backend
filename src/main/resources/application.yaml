spring:
  application:
    name: th-piscinas-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

nfse:
  simulate: ${NFSE_SIMULATE:true}
  producao-confirmada: ${NFSE_PRODUCAO_CONFIRMADA:false}
  token: ${FOCUSNFE_TOKEN:}
  ambiente: ${FOCUSNFE_AMBIENTE:producao}
  cnpj-prestador: ${NFSE_CNPJ_PRESTADOR:}
  inscricao-municipal: ${NFSE_INSCRICAO_MUNICIPAL:}
  codigo-municipio: ${NFSE_CODIGO_MUNICIPIO:}
  razao-social: ${NFSE_RAZAO_SOCIAL:TH Bombas}
  email-prestador: ${NFSE_EMAIL_PRESTADOR:}
  codigo-tributacao-nacional: ${NFSE_CODIGO_TRIBUTACAO_NACIONAL:}
  codigo-tributacao-municipal: ${NFSE_CODIGO_TRIBUTACAO_MUNICIPAL:}
  aliquota: ${NFSE_ALIQUOTA:5.00}
  codigo-opcao-simples-nacional: ${NFSE_CODIGO_OPCAO_SIMPLES_NACIONAL:1}
  regime-especial-tributacao: ${NFSE_REGIME_ESPECIAL_TRIBUTACAO:0}
  tributacao-iss: ${NFSE_TRIBUTACAO_ISS:1}
  tipo-retencao-iss: ${NFSE_TIPO_RETENCAO_ISS:1}
  percentual-tributos-federais: ${NFSE_PERCENTUAL_TRIBUTOS_FEDERAIS:0.00}
  percentual-tributos-estaduais: ${NFSE_PERCENTUAL_TRIBUTOS_ESTADUAIS:0.00}
  percentual-tributos-municipais: ${NFSE_PERCENTUAL_TRIBUTOS_MUNICIPAIS:0.00}
  percentual-tributos-simples-nacional: ${NFSE_PERCENTUAL_TRIBUTOS_SIMPLES_NACIONAL:}
  serie-dps: ${NFSE_SERIE_DPS:1}

---
spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

app:
  jwt:
    refresh-expiration-days: ${JWT_REFRESH_DAYS:7}
  storage:
    location: /data/uploads
    base-url: /files

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never