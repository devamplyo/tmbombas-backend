# .github/workflows/deploy.yml
name: Build & Deploy Backend

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      version:
        description: "Versão para deploy (ex: 1.0.11) — deixe vazio para usar o pom.xml"
        required: false

jobs:
  build-and-push:
    name: Build Image & Push Docker Hub
    runs-on: self-hosted

    outputs:
      image_tag: ${{ steps.set_version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Resolve version
        id: set_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          fi
          echo "tag=backend-api-v.${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Versão resolvida: backend-api-v.${VERSION}"

      - name: Build JAR (skip tests)
        run: mvn clean package -DskipTests

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            tmbombas/tmbombas:${{ steps.set_version.outputs.tag }}
            tmbombas/tmbombas:latest

  deploy:
    name: Deploy no servidor
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Atualiza tag e sobe compose
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          cd /home/tmbombas/tmbombas-backend

          # Substitui só a tag da imagem no compose, preserva tudo o mais
          sed -i "s|tmbombas/tmbombas:backend-api-v\.[0-9]\+\.[0-9]\+\.[0-9]*|tmbombas/tmbombas:${IMAGE_TAG}|g" docker-compose.prod.yml

          # Puxa a nova imagem e recria só o container da API
          docker compose -f docker-compose.prod.yml pull th_piscinas_api
          docker compose -f docker-compose.prod.yml up -d --no-deps th_piscinas_api

      - name: Aguarda healthcheck
        run: |
          echo "Aguardando API subir..."
          for i in $(seq 1 12); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' th_piscinas_api 2>/dev/null || echo "missing")
            echo "  tentativa $i: $STATUS"
            if [ "$STATUS" = "healthy" ]; then
              echo "API healthy!"
              exit 0
            fi
            sleep 10
          done
          echo "ERRO: API não ficou healthy em 120s"
          docker logs --tail=50 th_piscinas_api
          exit 1
